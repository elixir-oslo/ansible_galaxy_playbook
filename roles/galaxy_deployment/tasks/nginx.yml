---
# =====================================================================
# AUTO-GENERATED FILE
# Source: galaxy.yml
# Do not edit manually unless you disable the sync generator.
# =====================================================================

- name: Remove default Nginx site layout if active
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
- name: Check if Galaxy welcome.sample.html exists
  stat:
    path: '{{ galaxy_server_dir }}/static/welcome.sample.html'
  register: galaxy_welcome_sample
- name: Check if Galaxy welcome.html exists
  stat:
    path: '{{ galaxy_server_dir }}/static/welcome.html'
  register: galaxy_welcome_file
- name: Create Galaxy welcome.html from sample if missing
  copy:
    src: '{{ galaxy_server_dir }}/static/welcome.sample.html'
    dest: '{{ galaxy_server_dir }}/static/welcome.html'
    remote_src: true
    owner: '{{ galaxy_user_name }}'
    group: '{{ galaxy_user_name }}'
    mode: '0644'
  when:
  - galaxy_welcome_sample.stat.exists
  - not galaxy_welcome_file.stat.exists
- name: Ensure nginx site directories exist
  file:
    path: '{{ item }}'
    state: directory
    mode: '0755'
  loop:
  - /etc/nginx/sites-available
  - /etc/nginx/sites-enabled
- name: Install Galaxy nginx site
  copy:
    dest: /etc/nginx/sites-available/galaxy
    content: "server {\n    listen 80 default_server;\n    server_name _;\n\n    client_max_body_size 10G;\n\n    location /static/ {\n        alias {{ galaxy_server_dir }}/static/;\n        expires 30d;\n        add_header Cache-Control \"public, max-age=2592000\";\n        access_log off;\n    }\n\n    location / {\n        proxy_pass http://127.0.0.1:{{ galaxy_web_port }};\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_buffering off;\n    }\n}\n"
- name: Enable Galaxy nginx site
  file:
    src: /etc/nginx/sites-available/galaxy
    dest: /etc/nginx/sites-enabled/galaxy
    state: link
    force: true
- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
- name: Validate nginx config
  command: nginx -t
- name: Restart nginx
  service:
    name: nginx
    state: restarted
    enabled: true
