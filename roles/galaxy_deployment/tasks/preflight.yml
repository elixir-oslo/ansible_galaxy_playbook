---
# =====================================================================
# AUTO-GENERATED FILE
# Source: galaxy.yml
# Do not edit manually unless you disable the sync generator.
# =====================================================================

- name: Pre-authorize Galaxy repo for git (root)
  shell: 'git config --global --add safe.directory "{{ galaxy_server_dir }}" || true

    '
  args:
    executable: /bin/bash
- name: Force IPv4 for Node/Yarn
  lineinfile:
    path: /etc/environment
    line: NODE_OPTIONS=--dns-result-order=ipv4first
    create: true
- name: Export IPv4 globally
  lineinfile:
    path: /etc/profile
    line: export NODE_OPTIONS=--dns-result-order=ipv4first
    create: true
- name: Stop Galaxy if running
  service:
    name: galaxy
    state: stopped
  ignore_errors: true
- name: Verify Galaxy user exists
  user:
    name: '{{ galaxy_user_name }}'
    shell: /bin/bash
    state: present
- name: Ensure Galaxy root exists before cache setup
  file:
    path: '{{ galaxy_root }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Ensure Galaxy cache directory exists before role handlers
  file:
    path: '{{ galaxy_root }}/.cache'
    state: directory
    owner: '{{ galaxy_user_name }}'
    group: '{{ galaxy_user_name }}'
    mode: '0755'
- name: Ensure Galaxy cache ownership before role handlers
  file:
    path: '{{ galaxy_root }}/.cache'
    owner: '{{ galaxy_user_name }}'
    group: '{{ galaxy_user_name }}'
    recurse: true
- name: Remove old Gravity runtime state before Galaxy role
  file:
    path: '{{ galaxy_mutable_data_dir }}/gravity/state'
    state: absent
  ignore_errors: true
- name: Update apt cache
  apt:
    update_cache: true
  changed_when: false
- name: Install system dependencies
  apt:
    name:
    - build-essential
    - git
    - python3
    - python3-venv
    - python3-virtualenv
    - python3-pip
    - python3-dev
    - acl
    - nginx
    - postgresql
    - curl
    - ca-certificates
    - gnupg
    state: present
- name: Install Node.js 22.x from NodeSource
  shell: 'curl -fsSL https://deb.nodesource.com/setup_22.x | bash -

    apt-get install -y nodejs

    '
  args:
    executable: /bin/bash
  changed_when: false
- name: Enable Corepack for Node.js (handles yarn/pnpm versions)
  shell: corepack enable
  changed_when: false
  ignore_errors: true
- name: Ensure Galaxy root foundation directory exists
  file:
    path: /srv/galaxy
    state: directory
    owner: galaxy
    group: galaxy
    mode: '0755'
- name: Pre-initialize yarn/npm cache to prevent build attempts
  shell: 'npm cache clean --force || true

    mkdir -p {{ galaxy_mutable_data_dir }}/npm-cache

    '
  changed_when: false
  ignore_errors: true
- name: Remove default Nginx site symlink to prevent port conflicts
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
