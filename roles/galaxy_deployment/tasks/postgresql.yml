- name: Ensure required APT packages for PostgreSQL repository
  apt:
    name:
    - gnupg
    - ca-certificates
    - curl
    - lsb-release
    state: present
    update_cache: true
- name: Run role galaxyproject.postgresql
  include_role:
    name: galaxyproject.postgresql
  vars:
    postgresql_version: 16
    postgresql_use_pgdg: true
    postgresql_packages:
    - postgresql-16
    - postgresql-client-16
