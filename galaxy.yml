---
# ========================================================================
# GALAXY ANSIBLE PLAYBOOK (FIXED TASK SEQUENCING ✅)
# ========================================================================

# ========================================================================
# PLAY 1: Install PostgreSQL server
# ========================================================================
- name: Install PostgreSQL server
  hosts: galaxyservers
  become: true

  vars_files:
    - group_vars/galaxyservers.yml

  vars:
    postgresql_version: 16

    # ✅ CRITICAL:
    # Enable the official PostgreSQL APT repository,
    # otherwise postgresql-16 may not exist on a fresh Ubuntu VM.
    postgresql_use_pgdg: true

    postgresql_packages:
      - "postgresql-16"
      - "postgresql-client-16"

  pre_tasks:
    - name: Ensure required APT packages for PostgreSQL repository
      apt:
        name:
          - gnupg
          - ca-certificates
          - curl
          - lsb-release
        state: present
        update_cache: yes

  roles:
    - role: galaxyproject.postgresql

# ========================================================================
# PLAY 2: Create Galaxy DB and user
# ========================================================================
- name: Setup PostgreSQL database for Galaxy
  hosts: dbservers
  become: true
  become_user: postgres
  vars_files:
    - group_vars/galaxyservers.yml
  vars:
    postgresql_version: 16
  roles:
    - role: galaxyproject.postgresql_objects

# ========================================================================
# PLAY 3: Galaxy Deployment
# ========================================================================
- name: Deploy Galaxy application with Nginx
  hosts: galaxyservers
  become: true
  vars_files:
    - group_vars/galaxyservers.yml

  # --------------------------------------------------------------------
  # PRE-TASKS (Only global system preparation allowed here)
  # --------------------------------------------------------------------
  pre_tasks:
     - name: Pre-authorize Galaxy repo for git (root)
       shell: |
         git config --global --add safe.directory "{{ galaxy_server_dir }}" || true
       args:
         executable: /bin/bash

     - name: Force IPv4 for Node/Yarn
       lineinfile:
         path: /etc/environment
         line: 'NODE_OPTIONS=--dns-result-order=ipv4first'
         create: yes

     - name: Export IPv4 globally
       lineinfile:
         path: /etc/profile
         line: 'export NODE_OPTIONS=--dns-result-order=ipv4first'
         create: yes

     - name: Stop Galaxy if running
       service:
         name: galaxy
         state: stopped
       ignore_errors: true

     - name: Verify Galaxy user exists
       user:
         name: "{{ galaxy_user_name }}"
         shell: /bin/bash
         state: present
    # ------------------------------------------------------------
    # ✅ FIX: Ensure Galaxy cache is writable before Galaxy role/handlers
    # ------------------------------------------------------------
     - name: Ensure Galaxy root exists before cache setup
       file:
         path: "{{ galaxy_root }}"
         state: directory
         owner: root
         group: root
         mode: "0755"

     - name: Ensure Galaxy cache directory exists before role handlers
       file:
         path: "{{ galaxy_root }}/.cache"
         state: directory
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         mode: "0755"

     - name: Ensure Galaxy cache ownership before role handlers
       file:
         path: "{{ galaxy_root }}/.cache"
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         recurse: yes
     - name: Remove old Gravity runtime state before Galaxy role
       file:
            path: "{{ galaxy_mutable_data_dir }}/gravity/state"
            state: absent
       ignore_errors: true

     - name: Update apt cache
       apt:
         update_cache: yes
       changed_when: false

     - name: Install system dependencies
       apt:
         name:

           - build-essential
           - git
           - python3
           - python3-venv
           - python3-virtualenv
           - python3-pip
           - python3-dev
           - acl
           - nginx
           - postgresql
           - curl
           - ca-certificates
           - gnupg


         state: present

    # ✅ CORRECT (Parameters are back in Ansible's scope)
     - name: Install Node.js 22.x from NodeSource
       shell: |
         curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
         apt-get install -y nodejs
       args:
         executable: /bin/bash
       changed_when: false

     - name: Enable Corepack for Node.js (handles yarn/pnpm versions)
       shell: corepack enable
       changed_when: false
       ignore_errors: true

     - name: Ensure Galaxy root foundation directory exists
       file:
         path: /srv/galaxy
         state: directory
         owner: galaxy
         group: galaxy
         mode: "0755"

     - name: Pre-initialize yarn/npm cache to prevent build attempts
       shell: |
         npm cache clean --force || true
         mkdir -p {{ galaxy_mutable_data_dir }}/npm-cache
       changed_when: false
       ignore_errors: true

     - name: Remove default Nginx site symlink to prevent port conflicts
       file:
          path: /etc/nginx/sites-enabled/default
          state: absent

  # --------------------------------------------------------------------
  # ROLES (Clones repository into completely empty server path)
  # --------------------------------------------------------------------
  roles:
     - role: galaxyproject.galaxy

       vars:
         galaxy_client_use_prebuilt: false
         galaxy_build_client: false
         galaxy_skip_client_build: true
         galaxy_client_make: false
         galaxy_manage_node: false
       environment:
         GRAVITY_CONFIG_FILE: "{{ galaxy_config_dir }}/galaxy.yml"

     - role: galaxyproject.miniconda
       become_user: "{{ galaxy_user_name }}"


  # --------------------------------------------------------------------
   # POST-TASKS (Executes safely after Git code is populated)
   # ------------------------------------------------------ -----------
  post_tasks:

     - name: Ensure tool-data path structures exist
       file:
         path: "{{ galaxy_server_dir }}/tool-data/shared/ucsc"
         state: directory
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         mode: "0755"

     - name: Guarantee tool-data folder permissions
       file:
         path: "{{ galaxy_server_dir }}/tool-data"
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         recurse: yes
       ignore_errors: true

    # ------------------------------------------------------------
    # ✅ FIX: Ensure Galaxy virtualenv is writable by galaxy user
    # ------------------------------------------------------------
     - name: Fix Galaxy virtualenv ownership
       file:
         path: "{{ galaxy_virtual_env }}"
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         recurse: yes

     - name: Ensure Galaxy root cache is writable
       file:
         path: "{{ galaxy_root }}/.cache"
         state: directory
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         mode: "0755"



     # ✅ Database Schema Provisioning
     - name: Initialize DB
       become_user: "{{ galaxy_user_name }}"
       shell: |
         . {{ galaxy_virtual_env }}/bin/activate
         python {{ galaxy_server_dir }}/scripts/manage_db.py \
           -c {{ galaxy_config_dir }}/galaxy.yml \
           version
       args:
         chdir: "{{ galaxy_server_dir }}"
         executable: /bin/bash
       environment:
         GALAXY_CONFIG_FILE: "{{ galaxy_config_dir }}/galaxy.yml"
       register: db_init_result
       changed_when: "'already initialized' not in db_init_result.stderr|lower"


    # ------------------------------------------------------------
    # ✅ FIX: Ensure Galaxy cache directory is writable
    # ------------------------------------------------------------
     - name: Ensure Galaxy cache directory exists
       file:
         path: "{{ galaxy_root }}/.cache"
         state: directory
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         mode: "0755"

     - name: Ensure Galaxy cache ownership is correct
       file:
         path: "{{ galaxy_root }}/.cache"
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         recurse: yes


    # ------------------------------------------------------------
    # ✅ Services activation
    # ------------------------------------------------------------
     - name: Reload systemd configuration definitions
       systemd:
         daemon_reload: true

     - name: Start Galaxy Service
       service:
         name: galaxy
         state: started
         enabled: true

     - name: Remove default Nginx site layout if active
       file:
         path: /etc/nginx/sites-enabled/default
         state: absent


    # ------------------------------------------------------------
    # ✅ Reset + restart cycle for operational safety
    # ------------------------------------------------------------
     - name: Reset Gravity state
       file:
         path: "{{ galaxy_mutable_data_dir }}/gravity/state"
         state: absent
       ignore_errors: true

     - name: Restart Galaxy Engine Cleanly
       service:
         name: galaxy
         state: restarted


    # ------------------------------------------------------------
    # ✅ Live Application Gateway Health checks
    # ------------------------------------------------------------
     - name: Wait for Galaxy process to stabilize
       pause:
         seconds: 300 # wait for 5 minutes

     - name: Wait for Galaxy web port allocation bounds
       wait_for:
         host: 127.0.0.1
         port: "{{ galaxy_web_port }}"
         delay: 5
         timeout: 300
         state: started

     - name: Validate System via Core API Endpoint Response Verification
       uri:
         url: "http://127.0.0.1:{{ galaxy_web_port }}/api/version"
         method: GET
         status_code: 200
       register: galaxy_api_response
       retries: 10
       delay: 10
       until: galaxy_api_response.status == 200


    # ------------------------------------------------------------
    # ✅ Build Galaxy client only after backend API is healthy
    # ------------------------------------------------------------
     - name: Stop Galaxy before client build
       service:
         name: galaxy
         state: stopped
       when: build_galaxy_client_after_api | default(false)

     - name: Clean old client artifacts
       file:
         path: "{{ item }}"
         state: absent
       loop:
         - "{{ galaxy_server_dir }}/static/dist"
         - "{{ galaxy_server_dir }}/client/node_modules"
         - "{{ galaxy_server_dir }}/client_build_hash.txt"
       when: build_galaxy_client_after_api | default(false)

     - name: Ensure Galaxy ownership before client build
       file:
         path: "{{ galaxy_root }}"
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         recurse: yes
       when: build_galaxy_client_after_api | default(false)

     - name: Prepare PNPM for Galaxy client build
       become_user: "{{ galaxy_user_name }}"
       shell: |
         set -e
         cd {{ galaxy_server_dir }}/client
         source {{ galaxy_virtual_env }}/bin/activate

         mkdir -p {{ galaxy_root }}/.local/share/pnpm
         mkdir -p {{ galaxy_root }}/.cache

         corepack enable || true

         PACKAGE_MANAGER=$(python3 -c 'import json; print(json.load(open("package.json")).get("packageManager", "pnpm@10.26.1"))')
         echo "Preparing package manager: ${PACKAGE_MANAGER}"

         corepack prepare "${PACKAGE_MANAGER}" --activate
       args:
         executable: /bin/bash
       environment:
         HOME: "{{ galaxy_root }}"
         PNPM_HOME: "{{ galaxy_root }}/.local/share/pnpm"
         PATH: "{{ galaxy_root }}/.local/share/pnpm:{{ galaxy_virtual_env }}/bin:/usr/local/bin:/usr/bin:/bin"
       when: build_galaxy_client_after_api | default(false)

     - name: Build Galaxy client production bundle
       become_user: "{{ galaxy_user_name }}"
       shell: |
          set -e
          source {{ galaxy_virtual_env }}/bin/activate
          cd {{ galaxy_server_dir }}
          make client-production
#          echo "Node version:"
#          node -v
#
#          echo "Corepack version:"
#          corepack --version || true
          
#          echo "PNPM version:"
#          pnpm -v || true
          

       args:
          executable: /bin/bash
       environment:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          HOME: "{{ galaxy_root }}"
          PNPM_HOME: "{{ galaxy_root }}/.local/share/pnpm"
          PATH: "{{ galaxy_root }}/.local/share/pnpm:{{ galaxy_virtual_env }}/bin:/usr/local/bin:/usr/bin:/bin"
       when: build_galaxy_client_after_api | default(false)


     - name: Check Galaxy static dist directory
       stat:
         path: "{{ galaxy_server_dir }}/static/dist"
       register: static_dist
       when: build_galaxy_client_after_api | default(false)

     - name: Fail if static/dist is missing
       fail:
         msg: "Galaxy client build failed: {{ galaxy_server_dir }}/static/dist does not exist"
       when:
         - build_galaxy_client_after_api | default(false)
         - not static_dist.stat.exists

     - name: Check for files in static/dist
       shell: |
         find {{ galaxy_server_dir }}/static/dist -type f | head -n 5
       register: static_files
       changed_when: false
       when: build_galaxy_client_after_api | default(false)

     - name: Fail if static/dist is empty
       fail:
         msg: "Galaxy client build failed: static/dist exists but contains no files"
       when:
         - build_galaxy_client_after_api | default(false)
         - static_files.stdout == ""

     - name: Show sample built client files
       debug:
         var: static_files.stdout_lines
       when: build_galaxy_client_after_api | default(false)

     - name: Fix static ownership
       file:
         path: "{{ galaxy_server_dir }}/static"
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         recurse: yes
       when: build_galaxy_client_after_api | default(false)

    # ------------------------------------------------------------
    # ✅ Ensure Galaxy welcome.html exists
    # ------------------------------------------------------------
     - name: Check if Galaxy welcome.sample.html exists
       stat:
         path: "{{ galaxy_server_dir }}/static/welcome.sample.html"
       register: galaxy_welcome_sample

     - name: Check if Galaxy welcome.html exists
       stat:
         path: "{{ galaxy_server_dir }}/static/welcome.html"
       register: galaxy_welcome_file

     - name: Create Galaxy welcome.html from sample if missing
       copy:
         src: "{{ galaxy_server_dir }}/static/welcome.sample.html"
         dest: "{{ galaxy_server_dir }}/static/welcome.html"
         remote_src: true
         owner: "{{ galaxy_user_name }}"
         group: "{{ galaxy_user_name }}"
         mode: "0644"
       when:
         - galaxy_welcome_sample.stat.exists
         - not galaxy_welcome_file.stat.exists

    # ---------------------------------------------------------------------
    # ✅ Restart Galaxy to serve new client assets and validate API again
    # --------------------------------------------------------------------
     - name: Start Galaxy after client build
       service:
         name: galaxy
         state: started
         enabled: true
       when: build_galaxy_client_after_api | default(false)

     - name: Wait for Galaxy after client build
       pause:
         seconds: 300
       when: build_galaxy_client_after_api | default(false)

     - name: Validate Galaxy API after client build
       uri:
         url: "http://127.0.0.1:{{ galaxy_web_port }}/api/version"
         method: GET
         status_code: 200
       register: galaxy_api_after_client
       retries: 10
       delay: 10
       until: galaxy_api_after_client.status == 200
       when: build_galaxy_client_after_api | default(false)



         # ------------------------------------------------------------
         # ✅ Manual nginx config for Galaxy
         # ------------------------------------------------------------
     - name: Ensure nginx site directories exist
       file:
             path: "{{ item }}"
             state: directory
             mode: "0755"
       loop:
             - /etc/nginx/sites-available
             - /etc/nginx/sites-enabled

     - name: Install Galaxy nginx site
       copy:
             dest: /etc/nginx/sites-available/galaxy
             content: |
               server {
                   listen 80 default_server;
                   server_name _;
               
                   client_max_body_size 10G;
               
                   location /static/ {
                       alias {{ galaxy_server_dir }}/static/;
                       expires 30d;
                       add_header Cache-Control "public, max-age=2592000";
                       access_log off;
                   }
               
                   location / {
                       proxy_pass http://127.0.0.1:{{ galaxy_web_port }};
                       proxy_set_header Host $host;
                       proxy_set_header X-Real-IP $remote_addr;
                       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                       proxy_set_header X-Forwarded-Proto $scheme;
                       proxy_buffering off;
                   }
               }

     - name: Enable Galaxy nginx site
       file:
             src: /etc/nginx/sites-available/galaxy
             dest: /etc/nginx/sites-enabled/galaxy
             state: link
             force: true

     - name: Remove default nginx site
       file:
             path: /etc/nginx/sites-enabled/default
             state: absent

     - name: Validate nginx config
       command: nginx -t

     - name: Restart nginx
       service:
             name: nginx
             state: restarted
             enabled: true



    # ✅ Final output summary logs
     - name: Deployment summary
       debug:
         msg:
           - "✅ Galaxy framework infrastructure deployed successfully!"
           - "🌐 UI Target Gateway URL: http://{{ ansible_default_ipv4.address }}"
