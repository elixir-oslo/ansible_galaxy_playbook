---
# ========================================================================
# GALAXY ANSIBLE PLAYBOOK (CLEANED + STABLE)
# ========================================================================

# ========================================================================
# PLAY 1: Install PostgreSQL server
# ========================================================================
- name: Install PostgreSQL server
  hosts: galaxyservers
  become: true
  vars_files:
    - group_vars/galaxyservers.yml
  roles:
    - galaxyproject.postgresql
  vars:
    postgresql_version: 16
    postgresql_packages:
      - "postgresql-16"
      - "postgresql-client-16"

# ========================================================================
# PLAY 2: Create Galaxy DB and user
# ========================================================================
- name: Setup PostgreSQL database for Galaxy
  hosts: dbservers
  become: true
  become_user: postgres
  vars_files:
    - group_vars/galaxyservers.yml
  roles:
    - galaxyproject.postgresql_objects

# ========================================================================
# PLAY 3: Galaxy Application Deployment
# ========================================================================
- name: Deploy Galaxy application with Nginx
  hosts: galaxyservers
  become: true
  vars_files:
    - group_vars/galaxyservers.yml

  # --------------------------------------------------------------------
  # PRE-TASKS
  # --------------------------------------------------------------------
  pre_tasks:
    # ------------------------------------------------------------
    # ✅ FIX NODE VERSION (CRITICAL)
    # ------------------------------------------------------------
    - name: Check current Node version
      shell: node -v
      register: node_check_cmd
      ignore_errors: true
      changed_when: false

    - name: Determine if Node 20 needs to be installed
      set_fact:
        install_node_20: "{{ true if (node_check_cmd.rc != 0 or 'v20.' not in node_check_cmd.stdout) else false }}"  #  Replaced numeric math with a foolproof Boolean lookup

    - name: Remove old nodejs
      apt:
        name:
          - nodejs
          - npm
        state: absent
        purge: true
      when: install_node_20

    - name: Install dependencies for Node repo
      apt:
        name:
          - curl
          - ca-certificates
          - gnupg
        state: present
      when: install_node_20

    - name: Add NodeSource repo (Node 20)
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        executable: /bin/bash
      when: install_node_20

    - name: Install Node.js 20
      apt:
        name: nodejs
        state: present
      when: install_node_20

    - name: Verify Node version
      command: node -v
      register: node_verify_output
      changed_when: false

    - name: Print Node version
      debug:
        msg: "Node version installed: {{ node_verify_output.stdout }}"

    # ------------------------------------------------------------
    # ✅ STOP GALAXY IF RUNNING
    # ------------------------------------------------------------
    - name: Stop Galaxy if running
      service:
        name: galaxy
        state: stopped
      ignore_errors: true

    # ------------------------------------------------------------
    # PACKAGE SETUP
    # ------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install system dependencies
      apt:
        name:
          - build-essential
          - git
          - python3
          - python3-venv
          - python3-virtualenv
          - python3-dev
          - acl
          - nginx
          - postgresql
        state: present
      when: ansible_os_family == "Debian"

    - name: Clear broken or dirty virtualenv to allow fresh nodeenv compilation
      file:
        path: /srv/galaxy/venv
        state: absent

  # --------------------------------------------------------------------
  # ROLES
  # --------------------------------------------------------------------
  roles:
    - galaxyproject.galaxy

    - role: galaxyproject.miniconda
      become_user: "{{ galaxy_user_name }}"

    - role: galaxyproject.nginx

  # --------------------------------------------------------------------
  # POST-TASKS
  # --------------------------------------------------------------------
  post_tasks:
    # ------------------------------------------------------------
    # Init DB (idempotent)
    # ------------------------------------------------------------
    - name: Initialize Galaxy DB schema (first run only)
      become_user: "{{ galaxy_user_name }}"
      command: >
        {{ galaxy_virtual_env }}/bin/python
        {{ galaxy_server_dir }}/scripts/manage_db.py
        -c {{ galaxy_config_dir }}/galaxy.yml
        version
      args:
        creates: "{{ galaxy_mutable_data_dir }}/config/.galaxy_base_schema_initialized"

    # ------------------------------------------------------------
    # Initial services start
    # ------------------------------------------------------------
    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Start Galaxy
      service:
        name: galaxy
        state: started
        enabled: true

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        enabled: true

    # =============================================================
    # BOOTSTRAP (ONE-TIME)
    # =============================================================
    - name: Ensure bootstrap dir exists
      file:
        path: /var/lib/galaxy
        state: directory
        mode: "0755"

    - name: Check bootstrap marker
      stat:
        path: /var/lib/galaxy/bootstrap.done
      register: bootstrap_marker

    - name: Set bootstrap flag
      set_fact:
        do_bootstrap: "{{ not bootstrap_marker.stat.exists }}"

    # ------------------------------------------------------------
    # Stop services (bootstrap only)
    # ------------------------------------------------------------
    - name: Stop nginx (bootstrap)
      service:
        name: nginx
        state: stopped
      ignore_errors: true
      when: do_bootstrap

    - name: Stop galaxy (bootstrap)
      service:
        name: galaxy
        state: stopped
      ignore_errors: true
      when: do_bootstrap

    # ------------------------------------------------------------
    # Clean broken nginx config
    # ------------------------------------------------------------
    - name: Remove old nginx config
      file:
        path: /etc/nginx/conf.d/http_options.conf
        state: absent
      when: do_bootstrap

    # ------------------------------------------------------------
    # Ensure nginx directories exist
    # ------------------------------------------------------------
    - name: Ensure nginx directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
      when: do_bootstrap

    # ------------------------------------------------------------
    # Create nginx config
    # ------------------------------------------------------------
    - name: Create Galaxy nginx config
      copy:
        dest: /etc/nginx/sites-available/galaxy
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://unix:/srv/galaxy/mutable/gunicorn.sock;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      when: do_bootstrap

    # ------------------------------------------------------------
    # Enable nginx site
    # ------------------------------------------------------------
    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/galaxy
        dest: /etc/nginx/sites-enabled/galaxy
        state: link
        force: true
      when: do_bootstrap

    # ------------------------------------------------------------
    # Reset gravity
    # ------------------------------------------------------------
    - name: Reset Gravity state
      file:
        path: /srv/galaxy/mutable/gravity/state
        state: absent
      when: do_bootstrap

    # ------------------------------------------------------------
    # Reload systemd (bootstrap)
    # ------------------------------------------------------------
    - name: Reload systemd (bootstrap)
      systemd:
        daemon_reload: true
      when: do_bootstrap

    # ------------------------------------------------------------
    # Validate nginx config
    # ------------------------------------------------------------
    - name: Validate nginx config
      command: nginx -t
      when: do_bootstrap

    # ------------------------------------------------------------
    # Start services
    # ------------------------------------------------------------
    - name: Start Galaxy (bootstrap)
      service:
        name: galaxy
        state: started
      when: do_bootstrap

    - name: Wait for Galaxy
      pause:
        seconds: 20
      when: do_bootstrap

    - name: Start nginx (bootstrap)
      service:
        name: nginx
        state: started
      when: do_bootstrap

    # ------------------------------------------------------------
    # API check (bootstrap)
    # ------------------------------------------------------------
    - name: Verify Galaxy API via nginx
      uri:
        url: http://localhost/api/version
        status_code: 200
      register: api_check
      retries: 5
      delay: 5
      until: api_check.status == 200
      when: do_bootstrap

    - name: Mark bootstrap done
      file:
        path: /var/lib/galaxy/bootstrap.done
        state: touch
      when: do_bootstrap

    # =============================================================
    # NGINX + UI FIX (ANSIBLE)
    # =============================================================
    - name: Verify Galaxy backend is reachable
      uri:
        url: "http://127.0.0.1:8080/api/version"
        status_code: 200
      register: backend_check

    - name: Fail if backend is not reachable
      fail:
        msg: "Galaxy backend is not reachable on 127.0.0.1:8080"
      when: backend_check.status != 200

    # ------------------------------------------------------------
    # Verify static assets
    # ------------------------------------------------------------
    - name: Check Galaxy static assets directory
      stat:
        path: /srv/galaxy/server/static/dist
      register: static_dir

    - name: Fail if static assets missing
      fail:
        msg: "Galaxy static assets not found"
      when: not static_dir.stat.exists

    # ------------------------------------------------------------
    # Fix permissions
    # ------------------------------------------------------------
    - name: Fix static ownership
      file:
        path: /srv/galaxy/server/static
        owner: galaxy
        group: galaxy
        recurse: yes

    - name: Fix static directory permissions
      command: find /srv/galaxy/server/static -type d -exec chmod 755 {} \;

    - name: Fix static file permissions
      command: find /srv/galaxy/server/static -type f -exec chmod 644 {} \;

    # ------------------------------------------------------------
    # Install nginx config (UI fixed version)
    # ------------------------------------------------------------
    - name: Install nginx Galaxy UI config
      copy:
        dest: /etc/nginx/sites-available/galaxy
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 10G;

              location ^~ /static/ {
                  alias /srv/galaxy/server/static/;
                  access_log off;
                  expires 30d;
                  add_header Cache-Control "public, max-age=2592000";
              }

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_buffering off;
                  proxy_redirect off;
              }
          }

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/galaxy
        dest: /etc/nginx/sites-enabled/galaxy
        state: link
        force: true

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    # ------------------------------------------------------------
    # Validate nginx
    # ------------------------------------------------------------
    - name: Validate nginx config (final)
      command: nginx -t

    # ------------------------------------------------------------
    # Reload services
    # ------------------------------------------------------------
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded

    - name: Restart Galaxy
      service:
        name: galaxy
        state: restarted

    - name: Wait after restart
      pause:
        seconds: 5

    # ------------------------------------------------------------
    # Verification
    # ------------------------------------------------------------
    - name: Verify static asset serving
      shell: |
        FILE=$(ls /srv/galaxy/server/static/dist | head -n 1)
        curl -sf "http://localhost/static/dist/$FILE"
      register: static_test
      failed_when: static_test.rc != 0

    - name: Verify Galaxy API through nginx
      uri:
        url: http://localhost/api/version
        status_code: 200

    # ------------------------------------------------------------
    # FINAL HEALTH CHECKS
    # ------------------------------------------------------------
    - name: Ensure gunicorn exists
      stat:
        path: "{{ galaxy_virtual_env }}/bin/gunicorn"
      register: gunicorn_bin

    - name: Fail if gunicorn missing
      assert:
        that:
          - gunicorn_bin.stat.exists

    - name: Wait for Galaxy port
      wait_for:
        host: 127.0.0.1
        port: "{{ galaxy_web_port }}"
        delay: 10
        timeout: 300

    - name: Check Galaxy API
      uri:
        url: "http://127.0.0.1:{{ galaxy_web_port }}/api/version"
        status_code: 200
      register: galaxy_api_response
      retries: 3
      delay: 10
      until: galaxy_api_response.status == 200

    - name: Fail if Galaxy not working
      fail:
        msg: |
          Galaxy failed to start.
          Check logs:
          - /srv/galaxy/mutable/gravity/log/gunicorn.log
          - /srv/galaxy/mutable/gravity/log/celery.log
      when: galaxy_api_response.status != 200

    - name: Deployment summary
      debug:
        msg:
          - "✅ Galaxy deployed"
          - "🌐 UI: http://{{ ansible_default_ipv4.address }}"
          - "🔗 API: http://127.0.0.1:{{ galaxy_web_port }}/api/version"