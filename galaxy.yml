---
# ========================================================================
# GALAXY ANSIBLE PLAYBOOK (GOLDEN STABLE VERSION)
# ========================================================================


# ========================================================================
# PLAY 1: Install PostgreSQL server
# ========================================================================
- name: Install PostgreSQL server
  hosts: galaxyservers
  become: true

  vars_files:
    - group_vars/galaxyservers.yml

  vars:
    postgresql_version: 16
    postgresql_packages:
      - "postgresql-16"
      - "postgresql-client-16"

  roles:
    - role: galaxyproject.postgresql


# ========================================================================
# PLAY 2: Create Galaxy DB and user (CRITICAL)
# ========================================================================
- name: Setup PostgreSQL database for Galaxy
  hosts: dbservers
  become: true
  become_user: postgres

  vars_files:
    - group_vars/galaxyservers.yml

  roles:
    - role: galaxyproject.postgresql_objects


# ========================================================================
# PLAY 3: Galaxy Application Deployment
# ========================================================================
- name: Deploy Galaxy application with Nginx
  hosts: galaxyservers
  become: true

  vars_files:
    - group_vars/galaxyservers.yml


  # --------------------------------------------------------------------
  # PRE-TASKS
  # --------------------------------------------------------------------
  pre_tasks:


    # ------------------------------------------------------------
    # ✅ FIX YARN NETWORK HANG (FORCE IPv4)
    # ------------------------------------------------------------
    - name: Force IPv4 for Node/Yarn (environment)
      lineinfile:
        path: /etc/environment
        line: 'NODE_OPTIONS=--dns-result-order=ipv4first'
        create: yes

    - name: Export IPv4 preference for all shells
      lineinfile:
        path: /etc/profile
        line: 'export NODE_OPTIONS=--dns-result-order=ipv4first'
        create: yes

    # ✅ Node 20 fix (ONLY addition from your original)
    - name: Check current Node version
      command: node -v
      register: node_check
      ignore_errors: true
      changed_when: false

    - name: Install Node.js 20 if needed
      when: node_check.failed or ('v20.' not in node_check.stdout | default(''))
      block:

        - name: Remove old Node
          apt:
            name:
              - nodejs
              - npm
            state: absent
            purge: true
          ignore_errors: true

        - name: Install repo dependencies
          apt:
            name:
              - curl
              - ca-certificates
              - gnupg
            state: present
            update_cache: yes

        - name: Add NodeSource repo
          shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          args:
            executable: /bin/bash

        - name: Install Node.js
          apt:
            name: nodejs
            state: present

    - name: Verify Node version
      command: node -v
      register: node_version
      changed_when: false

    - name: Print Node version
      debug:
        msg: "Node version installed: {{ node_version.stdout }}"


    # ✅ Stop Galaxy if running
    - name: Stop Galaxy if running
      service:
        name: galaxy
        state: stopped
      ignore_errors: true


    # ✅ System dependencies (same as before)
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - build-essential
          - git
          - python3
          - python3-venv
          - python3-virtualenv
          - python3-dev
          - acl
          - nginx
          - postgresql
        state: present


  # --------------------------------------------------------------------
  # ROLES
  # --------------------------------------------------------------------
  roles:

    - role: galaxyproject.galaxy

    - role: galaxyproject.miniconda
      become_user: "{{ galaxy_user_name }}"

    - role: galaxyproject.nginx


  # --------------------------------------------------------------------
  # POST-TASKS
  # --------------------------------------------------------------------
  post_tasks:

    # ✅ DB init (safe)
    - name: Initialize Galaxy DB schema (first run only)
      become_user: "{{ galaxy_user_name }}"
      command: >
        {{ galaxy_virtual_env }}/bin/python
        {{ galaxy_server_dir }}/scripts/manage_db.py
        -c {{ galaxy_config_dir }}/galaxy.yml
        version
      args:
        creates: "{{ galaxy_mutable_data_dir }}/config/.galaxy_base_schema_initialized"


    # ✅ Start services
    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Start Galaxy
      service:
        name: galaxy
        state: started
        enabled: true

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
        enabled: true


    # ✅ Reset Gravity (important for stable startup)
    - name: Reset Gravity state
      file:
        path: /srv/galaxy/mutable/gravity/state
        state: absent


    # ✅ Restart Galaxy cleanly
    - name: Restart Galaxy
      service:
        name: galaxy
        state: restarted


    # ✅ Health checks
    - name: Ensure gunicorn exists
      stat:
        path: "{{ galaxy_virtual_env }}/bin/gunicorn"
      register: gunicorn_bin

    - name: Fail if gunicorn missing
      assert:
        that:
          - gunicorn_bin.stat.exists

    - name: Wait for Galaxy port
      wait_for:
        host: 127.0.0.1
        port: "{{ galaxy_web_port }}"
        delay: 10
        timeout: 300

    - name: Check Galaxy API
      uri:
        url: "http://127.0.0.1:{{ galaxy_web_port }}/api/version"
        status_code: 200
      register: galaxy_api_response
      retries: 5
      delay: 5
      until: galaxy_api_response.status == 200


    # ✅ Final output
    - name: Deployment summary
      debug:
        msg:
          - "✅ Galaxy deployed successfully"
          - "🌐 UI: http://{{ ansible_default_ipv4.address }}"
          - "🔗 API: http://127.0.0.1:{{ galaxy_web_port }}/api/version"