---
# Keycloak and its PostgreSQL in Docker Compose under /opt/keycloak, plus the semsec realm and the galaxy client.
# The realm and its users live in the database; this playbook never deletes them.
- name: Keycloak
  hosts: keycloakservers
  become: true
  vars:
    keycloak_version: 26.8.0
    keycloak_postgres_version: 18
    keycloak_dir: /opt/keycloak
    keycloak_hostname: auth.semsec.bsc.es
    keycloak_features: "preview,token-exchange,admin-fine-grained-authz:v1"
  tasks:
    - name: Keycloak directories
      ansible.builtin.file:
        path: "{{ keycloak_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - keycloak/import
        - keycloak/themes
        - keycloak/providers
        - postgresql

    # Only runs when the database is created for the first time
    - name: PostgreSQL init script for the Keycloak database and user
      ansible.builtin.copy:
        dest: "{{ keycloak_dir }}/postgresql/init.sh"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          set -e

          psql -v ON_ERROR_STOP=1 <<-EOSQL
              CREATE USER $KC_DB_USERNAME WITH ENCRYPTED PASSWORD '$KC_DB_PASSWORD';
              GRANT ALL ON SCHEMA public TO $KC_DB_USERNAME;
              CREATE DATABASE "$POSTGRES_KC_DATABASE" OWNER $KC_DB_USERNAME;
          EOSQL

    # Keycloak only reads the bootstrap admin on its first start
    - name: Keycloak secrets
      ansible.builtin.copy:
        dest: "{{ keycloak_dir }}/keycloak.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          POSTGRES_USER={{ keycloak_postgres_user }}
          POSTGRES_PASSWORD={{ keycloak_postgres_password }}
          KC_DB_USERNAME={{ keycloak_db_user }}
          KC_DB_PASSWORD={{ keycloak_db_password }}
          KC_BOOTSTRAP_ADMIN_USERNAME={{ keycloak_admin_user }}
          KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_admin_password }}
      no_log: true

    - name: Compose file
      ansible.builtin.template:
        src: templates/keycloak/docker-compose.yaml.j2
        dest: "{{ keycloak_dir }}/docker-compose.yaml"
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Keycloak and PostgreSQL running
      community.docker.docker_compose_v2:
        project_src: "{{ keycloak_dir }}"
        state: present
        remove_orphans: false

- name: Keycloak realm and clients
  hosts: keycloakservers
  # The inventory sets ansible_become, which wins over the become keyword; no sudo on the login node
  vars:
    ansible_become: false
    # community.general 9 has no keycloak action group for module_defaults
    keycloak_auth: &keycloak_auth
      auth_keycloak_url: "https://auth.semsec.bsc.es"
      auth_realm: master
      auth_username: "{{ keycloak_admin_user }}"
      auth_password: "{{ keycloak_admin_password }}"
  tasks:
    - name: Wait for Keycloak
      ansible.builtin.uri:
        url: "https://auth.semsec.bsc.es/realms/master"
      register: __kc_up
      until: __kc_up.status == 200
      retries: 30
      delay: 5
      delegate_to: localhost
      check_mode: false

    - name: Realm semsec
      community.general.keycloak_realm:
        <<: *keycloak_auth
        realm: semsec
        enabled: true
      delegate_to: localhost

    - name: Client galaxy
      community.general.keycloak_client:
        <<: *keycloak_auth
        realm: semsec
        client_id: galaxy
        enabled: true
        protocol: openid-connect
        public_client: false
        client_authenticator_type: client-secret
        secret: "{{ galaxy_keycloak_client_secret }}"
        standard_flow_enabled: true
        redirect_uris:
          - "https://galaxy.semsec.bsc.es/authnz/keycloak/callback"
        # The module replaces the whole attribute list, so all current ones are listed
        attributes:
          access.token.header.type.rfc9068: "false"
          acr.loa.map: "{}"
          backchannel.logout.revoke.offline.tokens: "false"
          backchannel.logout.session.required: "true"
          client.introspection.response.allow.jwt.claim.enabled: "false"
          client.use.lightweight.access.token.enabled: "false"
          client_credentials.use_refresh_token: "false"
          display.on.consent.screen: "false"
          dpop.bound.access.tokens: "false"
          frontchannel.logout.session.required: "true"
          id.token.as.detached.signature: "false"
          logout.confirmation.enabled: "false"
          oauth2.device.authorization.grant.enabled: "false"
          oauth2.jwt.authorization.grant.enabled: "false"
          oidc.ciba.grant.enabled: "false"
          pkce.code.challenge.method: S256
          realm_client: "false"
          request.object.required: not required
          require.pushed.authorization.requests: "false"
          standard.token.exchange.enabled: "false"
          tls.client.certificate.bound.access.tokens: "false"
          token.response.type.bearer.lower-case: "false"
          use.refresh.tokens: "true"
      delegate_to: localhost
