---
# galaxyproject.galaxy role
galaxy_layout: root-dir
galaxy_root: /srv/galaxy
galaxy_user_name: galaxy
galaxy_user:
  name: "{{ galaxy_user_name }}"
  shell: /bin/bash
galaxy_create_user: true
galaxy_separate_privileges: true
galaxy_manage_paths: true
# Gravity (process_manager: systemd) writes the units; the role's own galaxy.service would conflict
galaxy_manage_systemd: false
galaxy_systemd_mode: gravity
galaxy_manage_cleanup: true
galaxy_build_client: true

# PR #23986 (davelopez/galaxy crypt4gh_rebuild), full clone so the pinned sha resolves
galaxy_repo: https://github.com/davelopez/galaxy.git
galaxy_commit_id: ae37e517ebc3e8acbbd2225848f4b896511375f1
galaxy_force_checkout: true
# Debug only: keep protected job directories and store their tool output, see galaxy.yml; plaintext may stay on the Pulsar host
semsec_debug_protected_jobs: false

galaxy_admin_emails:
  - paul.degeest@vib.be
  - maierw@informatik.uni-freiburg.de
galaxy_server_name: galaxy.semsec.bsc.es

# galaxyproject.postgresql / postgresql_objects: local database, peer auth over the socket
postgresql_objects_users:
  - name: "{{ galaxy_user_name }}"
postgresql_objects_databases:
  - name: galaxy
    owner: "{{ galaxy_user_name }}"

# EGA Live Outbox file source template; a plain copy, since Galaxy expands its {{ }} itself
galaxy_config_files:
  - src: "{{ playbook_dir }}/files/galaxy/ega_outbox_file_source.yml"
    dest: "{{ galaxy_config_dir }}/ega_outbox_file_source.yml"
# SFTP support for the ssh file source type, which Galaxy only installs for file_sources_conf
galaxy_additional_venv_packages:
  - fs.sshfs

# Vault for the secrets of user-defined storages and file sources
galaxy_config_templates:
  - src: templates/galaxy/oidc_config.xml
    dest: "{{ galaxy_config_dir }}/oidc_config.xml"
  - src: templates/galaxy/oidc_backends_config.xml.j2
    dest: "{{ galaxy_config_dir }}/oidc_backends_config.xml"
  - src: templates/galaxy/vault_conf.yml.j2
    dest: "{{ galaxy_config_dir }}/vault_conf.yml"

# Data table files on CVMFS, loaded after the Galaxy sample
galaxy_cvmfs_data_tables:
  - /cvmfs/idc.galaxyproject.org/config/tool_data_table_conf.xml
  - /cvmfs/data.galaxyproject.org/byhand/location/tool_data_table_conf.xml
  - /cvmfs/data.galaxyproject.org/managed/location/tool_data_table_conf.xml
