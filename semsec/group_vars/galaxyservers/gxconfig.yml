---
galaxy_config:
  gravity:
    process_manager: systemd
    galaxy_root: "{{ galaxy_server_dir }}"
    galaxy_user: "{{ galaxy_user_name }}"
    virtualenv: "{{ galaxy_venv_dir }}"
    gunicorn:
      # The login-node nginx proxies galaxy.semsec.bsc.es to this port, over TLS
      bind: "0.0.0.0:8080"
      workers: 2
      extra_args: --forwarded-allow-ips="*" --certfile=/etc/ssl/semsec/host.pem --keyfile=/etc/ssl/semsec/galaxy-key.pem
      environment:
        REQUESTS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
        AWS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
      preload: true
    celery:
      enable: true
      enable_beat: true
      concurrency: 2
      pool: threads
      environment:
        REQUESTS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
        AWS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
  galaxy:
    brand: SemSec
    admin_users: "{{ galaxy_admin_email }}"
    database_connection: "postgresql:///galaxy?host=/var/run/postgresql"
    id_secret: "{{ galaxy_id_secret }}"
    galaxy_infrastructure_url: "https://{{ galaxy_server_name }}"
    # No nginx in front with access to the files: Galaxy serves /static itself
    static_enabled: true
    conda_auto_init: false
    conda_auto_install: false
    # PR #23986
    crypt4gh_enabled: true
    metadata_strategy: extended
    object_store_store_by: uuid
    job_config: "{{ galaxy_job_config }}"
    # User-defined storages: Pulsar writes outputs straight to the user's S3 bucket
    object_store_config:
      type: distributed
      search_for_missing: true
      backends:
        - id: default
          type: disk
          weight: 1
          files_dir: "{{ galaxy_file_path }}"
    object_store_templates:
      - include: "{{ galaxy_server_dir }}/lib/galaxy/objectstore/templates/examples/production_generic_s3.yml"
    # User-defined file sources, such as the EGA Live Outbox with the user's own login
    file_source_templates:
      - include: "{{ galaxy_config_dir }}/ega_outbox_file_source.yml"
    vault_config_file: "{{ galaxy_config_dir }}/vault_conf.yml"
    object_store_cache_path: "{{ galaxy_object_store_cache_path }}"
