---
galaxy_config:
  gravity:
    process_manager: systemd
    galaxy_root: "{{ galaxy_server_dir }}"
    galaxy_user: "{{ galaxy_user_name }}"
    virtualenv: "{{ galaxy_venv_dir }}"
    gunicorn:
      # The login-node nginx proxies galaxy.semsec.bsc.es to this port, over TLS
      bind: "0.0.0.0:8080"
      workers: 2
      extra_args: --forwarded-allow-ips="*" --certfile=/etc/ssl/semsec/host.pem --keyfile=/etc/ssl/semsec/galaxy-key.pem
      environment:
        REQUESTS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
        AWS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
      preload: true
    celery:
      enable: true
      enable_beat: true
      concurrency: 2
      pool: threads
      environment:
        REQUESTS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
        AWS_CA_BUNDLE: "{{ semsec_ca_bundle }}"
  galaxy:
    brand: SemSec
    admin_users: "{{ galaxy_admin_emails | join(',') }}"
    database_connection: "postgresql:///galaxy?host=/var/run/postgresql"
    id_secret: "{{ galaxy_id_secret }}"
    galaxy_infrastructure_url: "https://{{ galaxy_server_name }}"
    # No nginx in front with access to the files: Galaxy serves /static itself
    static_enabled: true
    # BSC's proxy rejects request bodies over 1 MiB; raise back to the default once it allows more
    chunk_upload_size: 1000000
    conda_auto_init: false
    conda_auto_install: false
    # PR #23986
    crypt4gh_enabled: true
    metadata_strategy: extended
    object_store_store_by: uuid
    job_config: "{{ galaxy_job_config }}"
    # Reference data from CVMFS: the IDC repository and the older data.galaxyproject.org
    tool_data_table_config_path: "{{ ([galaxy_server_dir ~ '/config/tool_data_table_conf.xml.sample'] + galaxy_cvmfs_data_tables) | join(',') }}"
    # User-defined storages: Pulsar writes outputs straight to the user's S3 bucket
    object_store_config:
      type: distributed
      search_for_missing: true
      backends:
        # Existing datasets only; weight 0 sends new datasets to S3
        - id: default
          type: disk
          weight: 0
          files_dir: "{{ galaxy_file_path }}"
        # Default for new datasets, so protected jobs work without a user storage
        - id: s3
          type: boto3
          weight: 1
          name: SemSec S3
          auth:
            access_key: "{{ rustfs_demo_access_key }}"
            secret_key: "{{ rustfs_demo_secret_key }}"
          bucket:
            name: "{{ s3_demo_bucket }}"
          connection:
            endpoint_url: "{{ s3_endpoint }}"
          cache:
            path: "{{ galaxy_object_store_cache_path }}/s3"
            size: 20
            # Outputs go straight to the bucket; no copy in the cache on the Pulsar host
            cache_updated_data: false
    object_store_templates:
      - include: "{{ galaxy_server_dir }}/lib/galaxy/objectstore/templates/examples/production_generic_s3.yml"
    # Tools run in BioContainers images: from CVMFS when built there, otherwise Apptainer on the Pulsar host pulls them from quay.io
    container_resolvers:
      - type: explicit_singularity
      - type: cached_mulled_singularity
        cache_directory: /cvmfs/singularity.galaxyproject.org/all
      - type: mulled_singularity
        auto_install: false
    # User-defined file sources, such as the EGA Live Outbox with the user's own login
    file_source_templates:
      - include: "{{ galaxy_config_dir }}/ega_outbox_file_source.yml"
    vault_config_file: "{{ galaxy_config_dir }}/vault_conf.yml"
    # Login through Keycloak (semsec realm), next to Galaxy's own accounts
    enable_oidc: true
    oidc_config_file: "{{ galaxy_config_dir }}/oidc_config.xml"
    oidc_backends_config_file: "{{ galaxy_config_dir }}/oidc_backends_config.xml"
    object_store_cache_path: "{{ galaxy_object_store_cache_path }}"
