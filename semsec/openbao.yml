---
# OpenBao on the recryptor VM, as the key store for the recryptor service.
# Init output (unseal keys, root token) goes only to semsec_pki_dir on the control node.
- name: OpenBao
  hosts: recryptorservers
  become: true
  vars:
    openbao_version: 2.7.2
    openbao_deb_sha256: 42bd0890a8e2060e5f29410ea828ee047aa2de21028045731a0516d5a532928c
    # The BSC network lets 8443 through between the VMs
    openbao_port: 8443
    openbao_addr: "https://{{ inventory_hostname }}:{{ openbao_port }}"
    openbao_init_file: "{{ semsec_pki_dir }}/openbao-init.json"
    openbao_key_shares: 3
    openbao_key_threshold: 2
  tasks:
    - name: Download the OpenBao package
      ansible.builtin.get_url:
        url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.deb"
        dest: "/var/cache/openbao_{{ openbao_version }}_linux_amd64.deb"
        checksum: "sha256:{{ openbao_deb_sha256 }}"
        mode: "0644"

    - name: Install OpenBao
      ansible.builtin.apt:
        deb: "/var/cache/openbao_{{ openbao_version }}_linux_amd64.deb"

    - name: Certificate and key from the internal CA
      ansible.builtin.copy:
        src: "{{ semsec_pki_dir }}/{{ item.src }}"
        dest: "/opt/openbao/tls/{{ item.dest }}"
        owner: openbao
        group: openbao
        mode: "0600"
      loop:
        - {src: "{{ inventory_hostname }}.pem", dest: tls.crt}
        - {src: "{{ inventory_hostname }}-key.pem", dest: tls.key}
      notify: Reload openbao

    - name: OpenBao configuration
      ansible.builtin.copy:
        dest: /etc/openbao/openbao.hcl
        owner: openbao
        group: openbao
        mode: "0640"
        content: |
          ui = true
          api_addr = "{{ openbao_addr }}"

          storage "pebbledb" {
            path = "/opt/openbao/data"
          }

          listener "tcp" {
            address       = "0.0.0.0:{{ openbao_port }}"
            tls_cert_file = "/opt/openbao/tls/tls.crt"
            tls_key_file  = "/opt/openbao/tls/tls.key"
          }
      notify: Restart openbao

    - name: Start OpenBao at boot
      ansible.builtin.systemd_service:
        name: openbao
        enabled: true
        state: started

    - name: Apply configuration changes before unsealing
      ansible.builtin.meta: flush_handlers

    - name: Wait for the listener
      ansible.builtin.wait_for:
        port: "{{ openbao_port }}"
        timeout: 60

    - name: Check whether OpenBao is initialised and sealed
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/seal-status"
      register: __bao_status

    # Stops here, before any keys exist, if the control node can't take the file
    - name: Check that the init file can be written on the control node
      ansible.builtin.copy:
        content: ""
        dest: "{{ openbao_init_file }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      vars:
        ansible_become: false
      when: not __bao_status.json.initialized

    - name: Initialise OpenBao
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/init"
        method: POST
        body_format: json
        body:
          secret_shares: "{{ openbao_key_shares }}"
          secret_threshold: "{{ openbao_key_threshold }}"
      register: __bao_init
      no_log: true
      when: not __bao_status.json.initialized

    - name: Save the unseal keys and root token on the control node
      ansible.builtin.copy:
        content: "{{ __bao_init.json | to_nice_json }}\n"
        dest: "{{ openbao_init_file }}"
        mode: "0600"
      delegate_to: localhost
      vars:
        ansible_become: false
      no_log: true
      when: not __bao_status.json.initialized

    - name: Read the unseal keys and root token
      ansible.builtin.set_fact:
        __bao_secrets: "{{ lookup('file', openbao_init_file) | from_json }}"
      no_log: true

    - name: Unseal OpenBao
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/unseal"
        method: POST
        body_format: json
        body:
          key: "{{ item }}"
      loop: "{{ __bao_secrets.keys_base64[:openbao_key_threshold] }}"
      no_log: true
      when: __bao_status.json.sealed or not __bao_status.json.initialized

    - name: List the secrets engines
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/mounts"
        headers:
          X-Vault-Token: "{{ __bao_secrets.root_token }}"
      register: __bao_mounts
      no_log: true

    - name: KV store for the recryptor
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/mounts/recryptor"
        method: POST
        headers:
          X-Vault-Token: "{{ __bao_secrets.root_token }}"
        body_format: json
        body:
          type: kv
          options:
            version: "2"
        status_code: [200, 204]
      no_log: true
      when: "'recryptor/' not in __bao_mounts.json.data"

    - name: Policy for the recryptor
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/policies/acl/recryptor"
        method: PUT
        headers:
          X-Vault-Token: "{{ __bao_secrets.root_token }}"
        body_format: json
        body:
          policy: |
            path "recryptor/data/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
            path "recryptor/metadata/*" {
              capabilities = ["read", "list", "delete"]
            }
        status_code: [200, 204]
      no_log: true
      changed_when: false

  handlers:
    - name: Restart openbao
      ansible.builtin.systemd_service:
        name: openbao
        state: restarted

    # OpenBao reloads its certificate on SIGHUP and stays unsealed
    - name: Reload openbao
      ansible.builtin.systemd_service:
        name: openbao
        state: reloaded
