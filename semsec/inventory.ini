[galaxyservers]
semsec-galaxy ansible_host=192.168.0.77

[dbservers:children]
galaxyservers

[s3servers]
semsec-galaxy

[pulsarservers]
semsec-pulsar ansible_host=192.168.0.222

[recryptorservers]
semsec-recryptor ansible_host=192.168.0.176

# Keycloak runs in Docker Compose under /opt/keycloak, set up by BSC; pki.yml only installs its certificate
[keycloakservers]
semsec-keycloak ansible_host=192.168.0.25

[all:vars]
ansible_user=paul
ansible_ssh_private_key_file=~/.ssh/paulsensec
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
